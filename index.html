    <style>
      /* Premium Splash Screen Styles */
      .splash-screen-wrapper {
        background-color: #0B1929;
        min-height: 100vh;
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        color: #ffffff;
        margin: 0;
        position: fixed;
        inset: 0;
        z-index: 99999;
      }
      .splash-container {
        text-align: center;
        animation: fadeIn 0.8s ease-out;
      }
      .splash-logo {
        width: 80px;
        height: 80px;
        background: linear-gradient(135deg, #143068 0%, #1c4490 100%);
        border-radius: 16px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 2.5rem;
        font-weight: 800;
        color: #ffffff;
        box-shadow: 0 10px 30px rgba(20, 48, 104, 0.3);
        margin: 0 auto 20px;
        position: relative;
        border: 2px solid rgba(255, 255, 255, 0.1);
      }
      .splash-title {
        font-size: 24px;
        font-weight: 700;
        margin: 0 0 8px 0;
        letter-spacing: -0.02em;
        color: #ffffff;
      }
      .splash-tagline {
        font-size: 12px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.15em;
        color: #e14d4d;
        margin-bottom: 30px;
      }
      .splash-spinner {
        width: 40px;
        height: 40px;
        border: 3px solid rgba(255, 255, 255, 0.1);
        border-top-color: #e14d4d;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin: 0 auto;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="splash-screen-wrapper">
        <div class="splash-container">
          <div class="splash-logo">+</div>
          <h1 class="splash-title">Medins Healthcare</h1>
          <p class="splash-tagline">Healthcare Excellence</p>
          <div class="splash-spinner"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
